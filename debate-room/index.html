<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec"><meta name="description" content="Gather a group, draw debate roles, and run a timed debate. A free, browser-local debate organizer.">
<title>The Debate Room — Set the motion. Make your case.</title>
<style>
:root{--paper:#f6f3ec;--ink:#202d38;--muted:#565e5d;--line:#d9dbd3;--orange:#b44726;--affirm:#266457;--negative:#9b422c;--white:#fffcf6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.4 system-ui,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:0 clamp(10px,2.2vw,24px) 16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.875rem}
header a{color:var(--affirm)}
h1,h2,h3,p{margin:0 0 6px}
h1{font-size:1.25rem;line-height:1.2}
h2{font-size:1.05rem}
h3{font-size:.95rem}
button,input,textarea,select{font:inherit;color:inherit}
button,input:not([type=checkbox]),textarea,select{border:1px solid #bfc5bb;background:var(--white);border-radius:5px;padding:6px 9px}
button{cursor:pointer;font-size:.875rem;font-weight:650;min-height:34px;line-height:1.25}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--ink);color:var(--white);border-color:var(--ink)}
button.accent{background:var(--orange);color:white;border-color:var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
label,summary{font-size:.875rem;font-weight:600}
label{display:block;margin-bottom:3px}
summary{cursor:pointer}
input:not([type=checkbox]),textarea{width:100%}
textarea{resize:vertical;min-height:62px}
textarea.names{min-height:78px}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--orange)}
.check{display:inline-flex;align-items:center;gap:5px;font-weight:500;margin:0}
.check input{accent-color:var(--orange)}
.hint,.status,.eyebrow{font-size:.875rem;color:var(--muted)}
.hint{margin:4px 0 6px}
.error{font-size:.875rem;color:var(--negative);font-weight:650}
.error:empty,.status:empty{display:none}
#setup,#session{padding-top:10px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.section,.timer-card,.agenda-box{min-width:0;background:var(--white);border:1px solid var(--line);padding:10px;border-radius:6px}
.section{margin-bottom:8px}
details.section>summary{margin-bottom:0}
details.section[open]>summary{margin-bottom:8px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,133px),1fr));gap:8px}
.time-field{position:relative}
.unit{display:none}
.submit-row,.session-top,.timer-controls,.nav-controls,.options,.pill-row,.agenda-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.submit-row{margin-top:8px}
.session-top,.agenda-title{justify-content:space-between}
.motion{overflow-wrap:anywhere;margin:0}
.roles{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 8px;font-size:.875rem}
.role-card{overflow-wrap:anywhere}
.affirmative{color:var(--affirm)}
.negative{color:var(--negative)}
.tag{font-size:.8125rem}
.session-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.timer-card .speaker{font-weight:650;overflow-wrap:anywhere}
.clock{font-size:clamp(2.4rem,6vw,4rem);line-height:1.05;font-weight:660;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.clock.warning{color:#ac6421}
.clock.expired{color:var(--negative)}
.nav-controls,.options{margin-top:6px}
.agenda{max-height:clamp(160px,38vh,340px);overflow:auto;margin:4px 0 0;padding:0;list-style:none}
.agenda li{display:grid;grid-template-columns:1.5em minmax(0,1fr) auto;gap:5px;padding:4px 5px;border-top:1px solid var(--line);font-size:.875rem;overflow-wrap:anywhere}
.agenda li.current{background:#e8ecdf}
.agenda b{display:block}
.agenda time{font-variant-numeric:tabular-nums}
.verdict{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.timer-card:fullscreen{overflow:auto;padding:4vh 5vw}
.timer-card:fullscreen .clock{font-size:clamp(4rem,18vh,8rem)}
.role-row{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 0;overflow-wrap:anywhere}
.role-row select{max-width:60%;flex:none}
#role-preferences,#ai-profile-list{margin-top:6px}
#ai-profile-list>div{margin-top:4px}
@media(max-width:650px){
  .form-grid,.session-columns{grid-template-columns:minmax(0,1fr);gap:0}
  .agenda-box{margin-top:6px}
  .agenda{max-height:148px}
  button{min-height:40px}
  .role-row select{min-height:38px}
}
</style>
<link rel="stylesheet" href="local-ai.css?v=3">
</head>
<body><div class="wrap">
<header><strong>Debate Room</strong><a href="https://jasonkessler.github.io/debate-room/guest.html">Join with an invite</a></header>
<main>
<div id="setup">
<h1 class="hero">Set up a debate</h1>
<form id="setup-form" novalidate>
<div class="form-grid">
<section class="section"><label for="proposition">Proposition</label><textarea id="proposition" rows="2" maxlength="1000" required>America should abolish the Electoral College.</textarea></section>
<section class="section"><label for="names">Participants · one name per line</label><textarea class="names" id="names" rows="3" maxlength="10000" required>Participant One
Participant Two
Participant Three</textarea>
<p class="hint" id="people-hint"></p>
<div id="role-preferences" hidden></div>
</section>
</div>
<details class="section"><summary>Format <span id="estimate" class="hint"></span></summary>
<p class="hint">Times are minutes:seconds. Start the answer timer after the question.</p>
<div class="field-grid" id="time-fields"></div>
<div class="field-grid" style="margin-top:8px"><div><label for="mod-questions">Moderator questions per debater</label><input id="mod-questions" type="number" min="0" max="20" step="1" value="2"></div><div><label for="audience-questions">Questions per questioner per debater</label><input id="audience-questions" type="number" min="0" max="20" step="1" value="1"></div></div>
</details>
<p id="error" class="error" role="alert"></p>
<div class="submit-row"><button class="primary" type="submit">Create debate</button></div>
</form>
</div>
<section id="session" hidden aria-label="Debate in progress">
<div class="session-top"><h1 id="motion" class="motion"></h1><div class="pill-row"><button id="reshuffle">Redraw roles</button><button id="edit">Edit setup</button></div></div>
<div id="roles" class="roles"></div>
<div class="session-columns">
<section class="timer-card" id="timer-card" aria-label="Current turn">
<span id="stage-kicker" class="eyebrow"></span><h2 id="stage-title"></h2><p id="speaker" class="speaker"></p>
<div id="clock" class="clock" role="timer" aria-label="Time remaining">2:00</div>
<p id="timer-status" class="status" role="status" aria-live="polite"></p>
<div class="timer-controls"><button class="primary" id="start">Start timer</button><button id="reset">Reset timer</button></div>
<div class="nav-controls"><button id="previous">Previous turn</button><button id="next">Next turn</button></div>
<div class="options"><label class="check"><input type="checkbox" id="sound" checked> Chime</label><button id="fullscreen">Full screen</button></div>
<div class="verdict" id="verdict" hidden><h3>Judges’ decision</h3><div class="timer-controls"><button id="win-affirmative">Affirmative wins</button><button id="win-negative">Negative wins</button><button id="win-tie">Draw</button></div><p id="winner" class="winner" role="status"></p><button id="finish" hidden>Return to setup</button></div>
</section>
<aside class="agenda-box"><div class="agenda-title"><h3>Agenda</h3><span class="hint" id="progress"></span></div><ol id="agenda" class="agenda"></ol></aside>
</div>
</section>
</main>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const roleLabels = {random:'Random', affirmative:'Affirmative', negative:'Negative', moderator:'Moderator', questioner:'Questioner'};
const rolePreferences = new Map();
const participantNames = () => $('names').value.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
function selectedRoles(config) {
  const chosen = Array.isArray(config.rolePreferences) ? config.rolePreferences
    : (config.aiProfiles ?? []).map(({name, role}) => [name, role]);
  const roles = new Map();
  for (const preference of chosen) {
    if (!Array.isArray(preference)) continue;
    const [name, oldRole] = preference;
    const role = oldRole === 'judge' ? 'questioner' : oldRole;
    if (config.names?.includes(name) && role !== 'random' && Object.hasOwn(roleLabels, role)) roles.set(name, role);
  }
  return roles;
}
function renderRolePreferences() {
  const list = $('role-preferences');
  const names = [...new Set(participantNames())];
  list.hidden = names.length === 0;
  list.innerHTML = names.map(name => `<label class="role-row"><span>${esc(name)}</span><select aria-label="Role for ${esc(name)}" data-name="${esc(name)}">
    ${Object.entries(roleLabels).map(([value, label]) => `<option value="${value}" ${(rolePreferences.get(name) ?? 'random') === value ? 'selected' : ''}>${label}</option>`).join('')}
    </select></label>`).join('');
}
$('role-preferences').addEventListener('change', event => {
  if (event.target.value === 'random') rolePreferences.delete(event.target.dataset.name);
  else rolePreferences.set(event.target.dataset.name, event.target.value);
  persist();
});
$('names').addEventListener('input', renderRolePreferences);
const timeDefs=[['opening','Opening constructive','2:00'],['rebuttal','Rebuttal','1:30'],['closing','Closing statement','2:00'],['answer','Answer to each question','1:00'],['deliberation','Judges’ deliberation','3:00']];
const KEY='debate-room-v1';let round=null,deadline=null,remaining=0,touched=false,audioContext=null,lastDisplayed=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=seconds=>Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
function parseTime(value){const m=/^(\d{1,3}):([0-5]\d)$/.exec(value.trim());if(!m)return null;const s=Number(m[1])*60+Number(m[2]);return s>=1&&s<=3600?s:null;}
$('time-fields').innerHTML=timeDefs.map(([id,label,value])=>`<div><label for="${id}">${label}</label><div class="time-field"><input id="${id}" value="${value}" inputmode="text" maxlength="6" aria-describedby="${id}-unit"><span class="unit" id="${id}-unit">min:sec</span></div></div>`).join('');
function getConfig() {
  const names = participantNames();
  return {
    proposition: $('proposition').value.trim(),
    names,
    rolePreferences: [...rolePreferences].filter(([name]) => names.includes(name)),
    times: Object.fromEntries(timeDefs.map(([id]) => [id, parseTime($(id).value)])),
    modQuestions: Number($('mod-questions').value),
    audienceQuestions: Number($('audience-questions').value)
  };
}
function applyConfig(c){rolePreferences.clear();for(const [name,role] of selectedRoles(c))rolePreferences.set(name,role);$('proposition').value=c.proposition||'';$('names').value=(c.names||[]).join('\n');timeDefs.forEach(([id,,defaultValue])=>$(id).value=c.times?.[id]?fmt(c.times[id]):defaultValue);$('mod-questions').value=c.modQuestions??2;$('audience-questions').value=c.audienceQuestions??1;renderRolePreferences();}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({config:getConfig(),round,sound:$('sound').checked}));}catch{}}
function estimate() {
  const {names, times, modQuestions, audienceQuestions} = getConfig();
  const questions = 2 * (modQuestions + Math.max(0, names.length - 3) * audienceQuestions);
  const total = 2 * (times.opening + times.rebuttal + times.closing) + questions * times.answer + times.deliberation;
  $('estimate').textContent = Object.values(times).every(value => value !== null) && Number.isFinite(total)
    ? `· ${fmt(total)} timed` : '· Check times';
  $('people-hint').textContent = names.length ? 'Choose a role or leave it random.' : 'Enter at least three names.';
}
function validate(config) {
  let field, message;
  if (!config.proposition) [field, message] = ['proposition', 'Enter a proposition.'];
  else if (config.names.length < 3) [field, message] = ['names', 'Enter at least three names.'];
  else if (config.names.length > 100) [field, message] = ['names', 'Use 100 participants or fewer.'];
  else if (new Set(config.names.map(name => name.toLocaleLowerCase())).size !== config.names.length) {
    [field, message] = ['names', 'Use a unique name for each participant.'];
  } else {
    const pins = [...selectedRoles(config).values()];
    const conflict = ['affirmative','negative','moderator'].find(role => pins.filter(value => value === role).length > 1);
    if (conflict) [field, message] = ['names', `Assign only one participant to the ${roleLabels[conflict]} role.`];
    else if (config.names.length - pins.filter(role => role === 'questioner').length < 3) {
      [field, message] = ['names', 'Leave at least three participants available for the two debaters and moderator.'];
    }
    for (const [id,label] of timeDefs) {
      if (!message && config.times[id] === null) [field,message] = [id, `${label} must be between 0:01 and 60:00.`];
    }
    for (const [id,key] of [['mod-questions','modQuestions'],['audience-questions','audienceQuestions']]) {
      if (!message && ($(id).value === '' || !Number.isInteger(config[key]) || config[key] < 0 || config[key] > 20)) {
        [field,message] = [id, 'Question counts must be whole numbers from 0 to 20.'];
      }
    }
  }
  document.querySelectorAll('[aria-invalid=true]').forEach(node => node.removeAttribute('aria-invalid'));
  $('error').textContent = message ?? '';
  if (!field) return true;
  const input = $(field);
  const format = input.closest?.('details');
  if (format) format.open = true;
  input.setAttribute('aria-invalid','true');
  input.focus();
  return false;
}
function shuffled(names){const result=[...names];for(let i=result.length-1;i>0;i--){const range=i+1,limit=Math.floor(4294967296/range)*range;let n;do{n=crypto.getRandomValues(new Uint32Array(1))[0];}while(n>=limit);const j=n%range;[result[i],result[j]]=[result[j],result[i]];}return result;}
function makeStages(c,roles){const a=roles.affirmative,n=roles.negative,t=c.times;const stages=[];const add=(kind,title,speaker,seconds,extra={})=>stages.push({kind,title,speaker,seconds,...extra});for(const [side,name] of [['affirmative',a],['negative',n]])add('opening',side==='affirmative'?'Affirmative constructive':'Negative constructive',name,t.opening,{side});for(const [side,name] of [['affirmative',a],['negative',n]])add('rebuttal',side==='affirmative'?'Affirmative rebuttal':'Negative rebuttal',name,t.rebuttal,{side});for(const [asker,count] of [[roles.moderator,c.modQuestions],...roles.questioners.map(name=>[name,c.audienceQuestions])])for(let q=1;q<=count;q++)for(const [side,name] of [['affirmative',a],['negative',n]])add('question',`Question ${q} · ${side==='affirmative'?'Affirmative':'Negative'}`,name,t.answer,{asker,side,question:q});for(const [side,name] of [['negative',n],['affirmative',a]])add('closing',side==='affirmative'?'Affirmative closing':'Negative closing',name,t.closing,{side});add('deliberation','Judges’ deliberation',[roles.moderator,...roles.questioners].join(', '),t.deliberation);return stages;}
function drawRoles(config) {
  const pinned = selectedRoles(config);
  const unassigned = shuffled(config.names.filter(name => !pinned.has(name)));
  const assigned = role => config.names.find(name => pinned.get(name) === role) ?? unassigned.shift();
  const affirmative = assigned('affirmative');
  const negative = assigned('negative');
  const moderator = assigned('moderator');
  const questioners = config.names.filter(name => pinned.get(name) === 'questioner');
  return {affirmative, negative, moderator, questioners: [...questioners, ...unassigned]};
}
function createRound(c){const roles=drawRoles(c);round={config:c,roles,stages:makeStages(c,roles),index:0,remaining:c.times.opening,deadline:null,touched:false,winner:null};deadline=null;remaining=round.remaining;touched=false;showRound();persist();}
function showRound() {
  const roles = round.roles;
  $('setup').hidden = true;
  $('session').hidden = false;
  $('motion').textContent = round.config.proposition;
  $('roles').innerHTML = ['affirmative', 'negative', 'moderator', ...(roles.questioners.length ? ['questioner'] : [])]
    .map(role => `<span class="role-card"><strong class="${role}">${roleLabels[role]}${role === 'questioner' && roles.questioners.length > 1 ? 's' : ''}</strong> ${role === 'questioner' ? roles.questioners.map(esc).join(', ') : esc(roles[role])}</span>`).join('');
  renderStage();
}
function renderStage(){const s=round.stages[round.index];$('stage-kicker').textContent=`Turn ${round.index+1} of ${round.stages.length}`;$('stage-title').textContent=s.title;$('speaker').textContent=s.kind==='question'?`${s.asker} asks → ${s.speaker} answers`:s.speaker;$('previous').disabled=round.index===0;$('next').disabled=round.index===round.stages.length-1;$('reshuffle').hidden=touched;$('verdict').hidden=s.kind!=='deliberation';$('progress').textContent=`${round.index+1} / ${round.stages.length}`;$('agenda').innerHTML=round.stages.map((x,i)=>`<li class="${i===round.index?'current':i<round.index?'past':''}" ${i===round.index?'aria-current="step"':''}><span>${i<round.index?'✓':i+1}</span><div><b>${esc(x.title)}</b>${x.kind==='question'?esc(x.asker)+' → ':''}${esc(x.speaker)}</div><time>${fmt(x.seconds)}</time></li>`).join('');$('winner').textContent=round.winner?round.winner==='draw'?'The panel declares a draw.':`${round.roles[round.winner]} wins for the ${round.winner==='affirmative'?'Affirmative':'Negative'}.`:'';$('finish').hidden=!round.winner;for(const id of ['win-affirmative','win-negative','win-tie'])$(id).disabled=remaining>0||deadline!==null;lastDisplayed=null;paintClock();}
function paintClock(){if(!round)return;const seconds=deadline===null?remaining:Math.max(0,Math.ceil((deadline-Date.now())/1000));if(seconds!==lastDisplayed){$('clock').textContent=fmt(seconds);$('clock').className='clock'+(seconds===0?' expired':seconds<=30?' warning':'');lastDisplayed=seconds;}$('start').disabled=seconds===0||!!round.winner;$('start').textContent=deadline!==null?'Pause':remaining<round.stages[round.index].seconds?'Resume':round.stages[round.index].kind==='question'?'Start answer timer':'Start timer';$('timer-status').textContent=round.winner?'Decision recorded.':seconds===0?'Time is up.':deadline!==null?'':remaining<round.stages[round.index].seconds?'Paused.':round.stages[round.index].kind==='question'?'Ask the question, then start the answer timer.':'';}
function snapshot(){if(!round)return;round.remaining=remaining;round.deadline=deadline;round.touched=touched;persist();}
function syncTime(){if(deadline!==null){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining===0){deadline=null;snapshot();chime();renderStage();}}paintClock();}
function unlockAudio(){if(!$('sound').checked)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});}catch{}}
function chime(){if(!$('sound').checked||!audioContext)return;try{for(const offset of [0,.3,.6]){const osc=audioContext.createOscillator(),gain=audioContext.createGain(),at=audioContext.currentTime+offset;osc.frequency.value=660;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.14,at+.02);gain.gain.exponentialRampToValueAtTime(.001,at+.22);osc.connect(gain);gain.connect(audioContext.destination);osc.start(at);osc.stop(at+.25);}}catch{}}
$('start').onclick=()=>{if(!round||remaining===0)return;unlockAudio();if(deadline!==null){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));deadline=null;}else{deadline=Date.now()+remaining*1000;touched=true;}snapshot();renderStage();};
$('reset').onclick=()=>{deadline=null;remaining=round.stages[round.index].seconds;round.winner=null;snapshot();renderStage();};
function move(delta){const i=round.index+delta;if(i<0||i>=round.stages.length)return;deadline=null;round.index=i;remaining=round.stages[i].seconds;round.winner=null;touched=true;snapshot();renderStage();}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
function backToSetup(){deadline=null;round=null;touched=false;$('session').hidden=true;$('setup').hidden=false;persist();estimate();window.scrollTo({top:0});$('proposition').focus();}
$('edit').onclick=()=>{if(touched&&!confirm('Return to setup and reset this round? Your proposition, names, and settings will be kept.'))return;backToSetup();};
$('finish').onclick=backToSetup;
$('reshuffle').onclick=()=>{if(!touched)createRound(round.config);};
for(const [id,winner] of [['win-affirmative','affirmative'],['win-negative','negative'],['win-tie','draw']])$(id).onclick=()=>{if(remaining>0||deadline!==null)return;round.winner=winner;snapshot();renderStage();};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('timer-card').requestFullscreen();}catch{$('timer-status').textContent='Full screen is unavailable in this browser.';}};
if(!document.fullscreenEnabled)$('fullscreen').hidden=true;
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen';});
$('sound').onchange=persist;
$('setup-form').oninput=()=>{estimate();persist();};
$('setup-form').onsubmit=e=>{e.preventDefault();const c=getConfig();if(validate(c)){createRound(c);window.scrollTo({top:0});$('start').focus();}};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved?.config)applyConfig(saved.config);if(typeof saved?.sound==='boolean')$('sound').checked=saved.sound;const r=saved?.round;if(r&&Array.isArray(r.stages)&&r.stages.length&&r.index>=0&&r.index<r.stages.length&&r.roles&&r.config&&Number.isFinite(r.remaining)){round=r;remaining=r.remaining;deadline=Number.isFinite(r.deadline)?r.deadline:null;touched=!!r.touched;if(deadline!==null&&deadline<=Date.now()){remaining=0;deadline=null;}showRound();}}catch{round=null;$('session').hidden=true;$('setup').hidden=false;}
renderRolePreferences();estimate();setInterval(syncTime,200);document.addEventListener('visibilitychange',syncTime);window.addEventListener('pagehide',snapshot);
</script>
<script src="local-ai.js?v=5"></script>
<script src="ai-participants.js"></script></body></html>
